name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  # Task 008: ローカルSupabaseスタックでmigrationとRLS/RPCをpgTAP検証する。
  # remote secretは一切使わない（DBはCI上の使い捨てローカルスタック）。
  # Dockerイメージ取得を含むため+3〜6分/runかかる
  db-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase stack
        # CLIはdevDependenciesでバージョン固定。migrationはstart時に自動適用される
        run: npx supabase start
      - name: Run pgTAP tests
        run: npx supabase test db
      # Task 011: 学生の週間受信枠が団体をまたぐ並行配信で破れないことを、
      # psqlを2プロセス以上起動して実際に並行するトランザクションで検証する
      # （pgTAPは1ファイル=1セッションのため本物の競合を作れない）
      - name: Run concurrency test
        run: npm run db:test:concurrency
      - name: Check generated types drift (informational)
        # 生成型（src/lib/database.types.ts）と実DBの差分を表示する。
        # 差分があってもこのステップは失敗させない（警告として出力）
        run: |
          npx supabase gen types typescript --local > /tmp/generated.types.ts
          if ! diff -u src/lib/database.types.ts /tmp/generated.types.ts; then
            echo "::warning::database.types.ts が supabase gen types の出力と異なります。npm run db:types で再生成してください"
          fi

  # Task 008: Playwright E2E（ローカルSupabase + Mailpit + Chromium）。
  # remote Supabase・本番secretは使わない。ブラウザへ渡すのはローカルスタックの
  # URLとpublishable keyだけで、service-role key・JWT secretは参照しない。
  # OTP・招待トークンはログ・アーティファクトへ出さない
  # （trace/video/screenshot無効 + PLAYWRIGHT_NO_COPY_PROMPT。
  #   後者が無いと、失敗時のaria snapshotへ入力値がそのまま残る）
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local Supabase stack
        # migrationはstart時に自動適用される（使い捨てのローカルスタック）
        run: npx supabase start
      - name: Export browser-safe env from supabase status
        # ブラウザへ公開してよい2値だけをGITHUB_ENVへ書き出す（値はログへ出力しない）。
        # service_role系・JWT secretのキーは一切参照しない
        run: |
          set -euo pipefail
          STATUS="$(npx supabase status -o env)"
          API_URL="$(printf '%s\n' "$STATUS" | sed -n 's/^\(SUPABASE_\)\{0,1\}API_URL=//p' | head -1 | tr -d '"')"
          PUB_KEY="$(printf '%s\n' "$STATUS" | sed -n 's/^\(SUPABASE_\)\{0,1\}PUBLISHABLE_KEY=//p' | head -1 | tr -d '"')"
          if [ -z "$PUB_KEY" ]; then
            PUB_KEY="$(printf '%s\n' "$STATUS" | sed -n 's/^\(SUPABASE_\)\{0,1\}ANON_KEY=//p' | head -1 | tr -d '"')"
          fi
          if [ -z "$API_URL" ] || [ -z "$PUB_KEY" ]; then
            echo "supabase statusからAPI URL/publishable keyを取得できませんでした" >&2
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUB_KEY"
          } >> "$GITHUB_ENV"
      - name: Run Playwright E2E
        # playwright.config.ts でも立てているが、設定漏れに備えてCI側でも指定する。
        # ここで明示するとCIではconfig側の代入が発火しないため、
        # configの1行が消えてもCIは気づけない。その回帰は
        # src/lib/playwrightConfigGuard.test.ts が検出する
        env:
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
        run: npm run e2e
