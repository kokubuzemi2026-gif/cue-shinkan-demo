name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 進行中の本番デプロイは中断せず完走させ、キュー済みの重複runは間引く
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # pushはmain限定だが、workflow_dispatchがmain以外から実行された場合も配信しない
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test -- --run
      - name: Build
        # 公開ビルドにはSupabaseのproject URLとpublishable keyが要る。
        # どちらも**ブラウザへ出る値**なのでsecretではなくActions variableへ置く
        # （secret key・service-role key・DBパスワードは絶対に置かない・D027）。
        # 未設定のままだと src/lib/supabaseClient.ts が null を返し、
        # 公開URLは「接続設定が必要です」の案内画面になる
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify build has Supabase config
        # **値そのものは出さない。** 埋まっているかどうかだけを見る。
        # 未設定のままdeployすると、いま動いている公開デモが案内画面に
        # 置き換わるため、deployの前にここで止める。
        # deployが失敗しても既に公開されているページはそのまま残る
        # （壊れたものが公開されるより、古いものが残るほうがよい）。
        # `set -x` を使わないこと（展開後の値がログへ出る）
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY が未設定です。" >&2
            echo "Settings -> Secrets and variables -> Actions -> Variables で設定してください" >&2
            echo "（docs/launch_plan.md §7 H7）。" >&2
            exit 1
          fi
          if ! grep -rqF "$VITE_SUPABASE_URL" dist/assets; then
            echo "ビルド成果物へSupabaseの接続設定が入っていません。" >&2
            exit 1
          fi
          echo "接続設定はビルド成果物へ入っています（値は出力しません）"
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          # pathはリポジトリルート基準。app/distの中身がartifact直下になる
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # デプロイに必要な昇格権限はこのjobにだけ与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
